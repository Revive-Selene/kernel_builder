name: Building kernel

on: # [push]
#  release:\
#    types: [published]
#  push:
#    branches:
#      - master
#    paths:
#      - '.config'
#  schedule:
#    - cron: 0 8 * * 5
# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'compilers used'
        required: true
        default: 'shattered-Clang-15'
      KREPO:
        description: 'kernel repo'
        required: true
        default: 'https://github.com/Revive-Selene/android_kernel_xiaomi_selene'
      KBRANCH:
        description: 'kernel branch (use 4.14 for base, 4.14-rssu for ReSukiSU pre-integrated)'
        required: true
        default: '4.14'
      NOTES:
        description: 'notes to print out'
        required: false
        default: ''
      VERBOSE:
        description: 'whether verbose logging should be enabled'
        required: false
        default: ''
      ZREPO:
        description: 'zipper repo'
        required: false
        default: ''
      ZBRANCH:
        description: 'zipper branch'
        required: false
        default: ''
      KSU:
        description: 'KSU mode: leave blank = no KSU, "yes" = init ReSukiSU submodule (use with 4.14-rssu branch), "both" = build twice (non-KSU then KSU)'
        required: false
        default: ''
      CONTAINER:
        description: 'if you know you know'
        required: true
        default: 'fedora:40'

env:
  REPO: ${{ github.event.inputs.KREPO }}
  RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}
  KERNEL_BRANCH: ${{ github.event.inputs.KBRANCH }}
  NOTE: ${{ github.event.inputs.NOTES }}
  COMPILERS: ${{ github.event.inputs.COMPILER }}
  PATCH_KSU: ${{ github.event.inputs.KSU }}
  VERBOSE: ${{ github.event.inputs.VERBOSE }}
  zipper_repo: ${{ github.event.inputs.ZREPO }}
  zipper_branch: ${{ github.event.inputs.ZBRANCH }}
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.inputs.CONTAINER }}

    steps:
        - name: checkout
          uses: actions/checkout@master

        - name: record start time
          run: |
            echo WORKFLOW_START=$(date +"%s") >> $GITHUB_ENV

        - name: init build env
          run: |
            dnf group install development-tools -y
            dnf install llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz -y
            ln -sf "/usr/bin/python3" /usr/bin/python
            git config --global user.name "Revive-Selene"
            git config --global user.email "revive-selene@github.com"

        - name: show host info
          run: |
            if [ ! -z "$VERBOSE" ]; then
              echo "Host: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'=' -f2)"
              echo "Free disk space: $(df --sync -BM --output=avail / | grep -v Avail)"
            fi

        - name: print notes if exists
          run: |
            if [ ! -z "$NOTE" ]; then
              echo "Note: $NOTE"
            fi

        - name: clone kernel source
          run: |
            echo "Cloning kernel from: $REPO (branch: $KERNEL_BRANCH)"
            git clone --depth=1 --single-branch --recurse-submodules -j4 $REPO -b $KERNEL_BRANCH kernel

        - name: print kernel info
          run: |
            cd kernel
            source ../env
            echo "Kernel name: ${kernel_name}"
            echo "Kernel ver:  ${kernel_ver}"
            echo "Head commit: ${kernel_head}"
            echo "Defconfig:   ${defconfig}"

        - name: run compilation scripts
          run: |
            cd kernel
            case $PATCH_KSU in
              "both" )
                bash ../build.sh "$COMPILERS"
                bash ../ksu/applyPatches.sh
                bash ../build.sh "$COMPILERS"
              ;;
              "" )
                bash ../build.sh "$COMPILERS"
              ;;
              * )
                bash ../ksu/applyPatches.sh
                bash ../build.sh "$COMPILERS"
              ;;
            esac

        - name: upload artifacts
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: kernel-${{ github.run_number }}-${{ github.run_attempt }}
            path: |
              kernel/*.zip
              kernel/*.log
            if-no-files-found: warn
            retention-days: 7

        - name: print build result
          if: always()
          run: |
            WORKFLOW_END=$(date +"%s")
            WDIFF=$((WORKFLOW_END - WORKFLOW_START))
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Build succeeded in $((WDIFF / 60))m $((WDIFF % 60))s"
            else
              echo "❌ Build failed in $((WDIFF / 60))m $((WDIFF % 60))s"
            fi
